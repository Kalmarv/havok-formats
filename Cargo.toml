[package]
name = "havok-formats"
description = "Bounds-checked readers of Havok tagfiles, packfiles, compressed collision meshes, cloth and spline animation, as game files store them"
keywords = ["havok", "gamedev", "modding", "parser", "collision"]
categories = ["parser-implementations", "game-development"]
readme = "README.md"
documentation = "https://docs.rs/havok-formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
primase-foundations.workspace = true

[dev-dependencies]
primase-testdata.workspace = true

[lints]
workspace = true

[workspace]


[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/havok-formats"
publish = true

[workspace.dependencies]
primase-foundations = { version = "0.2.0", git = "https://github.com/Kalmarv/primase-foundations", rev = "b3a3d4b3a892b8342fda081ab4449bb57052a2f8" }
primase-testdata = { version = "0.1.0", git = "https://github.com/Kalmarv/primase-testdata", rev = "d0258530ca9ca0ca74e957716ae8683e7facc8a7" }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
